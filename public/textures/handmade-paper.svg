<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <filter id="cloud" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="31" stitchTiles="stitch" result="clouds"/>
      <feColorMatrix in="clouds" type="matrix" values="0.12 0 0 0 0.77 0 0.11 0 0 0.75 0 0 0.09 0 0.70 0 0 0 0.28 0"/>
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.17 0.23" numOctaves="4" seed="17" stitchTiles="stitch" result="fibres"/>
      <feColorMatrix in="fibres" type="matrix" values="0.19 0 0 0 0.63 0 0.17 0 0 0.60 0 0 0.14 0 0.53 0 0 0 0.38 0"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="8" stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0.09 0 0 0 0.70 0 0.08 0 0 0.68 0 0 0.07 0 0.62 0 0 0 0.32 0"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="#f4f0e7"/>
  <rect width="500" height="500" filter="url(#cloud)" opacity="0.42"/>
  <rect width="500" height="500" filter="url(#fibre)" opacity="0.22"/>
  <rect width="500" height="500" filter="url(#grain)" opacity="0.18"/>
</svg>
